version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: hotel-pms-postgres
    restart: always
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - hotel_pms_postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
  server:
    image: hotel-pms-server:1.0.1
    container_name: hotel-pms-server
    restart: always
    environment:
      NODE_ENV: "production"
      PORT: "8002"
      DB_CONNECT_STRING: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required}"
      JWT_EXPIRES_IN: "${JWT_EXPIRES_IN:-12h}"
      CORS_ORIGIN: "${CORS_ORIGIN:-}"
      INIT: "${INIT:-0}"
      ROOT_USERNAME: "${ROOT_USERNAME:-root}"
      ROOT_PASSWORD: "${ROOT_PASSWORD:-}"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8002}:8002"

  nginx:
    image: hotel-pms-web:1.0.1
    container_name: hotel-pms-nginx
    restart: always
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - server

volumes:
  hotel_pms_postgres_prod_data:
